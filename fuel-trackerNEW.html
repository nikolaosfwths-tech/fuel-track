<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fuel Track">
<meta name="theme-color" content="#020617">
<title>Fuel Track</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg:#020617; --surface:#0f172a; --border:#1e293b; --border2:#334155;
  --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
  --blue:#0ea5e9; --blue-dark:#0284c7; --green:#22c55e; --green-dim:#166534;
  --plate-bg:#172554; --plate-border:#1d4ed8; --plate-text:#93c5fd;
  --red:#f87171; --red-dim:#7f1d1d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:12px}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh}
.hdr{background:#0a0f1e;border-bottom:1px solid var(--border);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-left{display:flex;align-items:center;gap:10px}
.logo-title{font-size:1.3rem;font-weight:900;letter-spacing:2px}
.logo-sub{font-size:0.65rem;color:#334155;letter-spacing:2px;margin-top:2px}
.body{padding:16px;max-width:560px;margin:0 auto}
.btn{background:linear-gradient(135deg,var(--blue),var(--blue-dark));border:none;border-radius:14px;color:#fff;font-family:'Courier New',monospace;font-weight:700;font-size:1.1rem;padding:16px 20px;cursor:pointer;letter-spacing:1px;display:inline-block;text-align:center;-webkit-appearance:none}
.btn:active{opacity:.8}
.btn-full{width:100%}
.btn-ghost{background:transparent;border:1px solid var(--blue);border-radius:14px;color:var(--blue);font-family:'Courier New',monospace;font-size:1.1rem;padding:16px 20px;cursor:pointer;-webkit-appearance:none}
.btn-ghost:active{opacity:.7}
.btn-danger{border-color:var(--red-dim);color:var(--red)}
.btn:disabled{opacity:.35}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.card-tap{cursor:pointer}
.card-tap:active{border-color:var(--blue);opacity:.85}
.plate{background:var(--plate-bg);border:2px solid var(--plate-border);border-radius:8px;padding:6px 14px;font-size:1.4rem;font-weight:900;color:var(--plate-text);letter-spacing:3px;display:inline-block}
.room-badge{font-size:1rem;color:#60a5fa;font-weight:700}
.badge{border-radius:20px;padding:5px 14px;font-size:0.8rem;font-weight:700;letter-spacing:1px;display:inline-block}
.badge-active{background:#1e40af22;color:#60a5fa;border:1px solid #1e40af}
.badge-done{background:#14532d22;color:#4ade80;border:1px solid var(--green-dim)}
.inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-family:'Courier New',monospace;font-size:1.3rem;letter-spacing:2px;font-weight:900;-webkit-appearance:none}
.inp:focus{outline:none;border-color:var(--blue)}
.inp-date{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-family:'Courier New',monospace;font-size:1rem;-webkit-appearance:none;appearance:none}
.inp-date:focus{outline:none;border-color:var(--blue)}
.inp-pass{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-family:'Courier New',monospace;font-size:1.1rem;-webkit-appearance:none}
.inp-pass:focus{outline:none;border-color:var(--blue)}
.lbl{font-size:0.8rem;color:var(--dim);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.field{margin-bottom:16px}
.sec{font-size:0.8rem;color:var(--border2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid #0f172a;padding-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-num{font-size:2rem;font-weight:900}
.stat-lbl{font-size:0.7rem;color:var(--muted);letter-spacing:1px;margin-top:3px}
.thumbs{display:flex;align-items:center;gap:10px;margin-top:10px}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex-shrink:0}
.thumb-empty{width:72px;height:72px;border-radius:10px;flex-shrink:0;background:var(--bg);border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.thumb-empty span{font-size:1.4rem}
.thumb-empty small{font-size:0.6rem;color:var(--border2);font-family:'Courier New',monospace}
.arrow{flex:1;text-align:center;font-size:1.6rem;color:var(--border2)}
.photos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.photo-slot img{width:100%;border-radius:10px;display:block;aspect-ratio:1;object-fit:cover}
.photo-slot-empty{aspect-ratio:1;background:var(--surface);border-radius:10px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--border2);font-size:0.8rem}
.date-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.date-item{display:flex;flex-direction:column;gap:2px}
.date-item-label{font-size:0.7rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.date-item-val{font-size:1rem;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{text-align:center;padding:60px 20px}
.empty-icon{font-size:3.5rem;margin-bottom:12px}
.empty-txt{font-size:0.9rem;letter-spacing:2px;color:var(--border2)}
.empty-sub{font-size:0.75rem;margin-top:8px;color:var(--border)}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt16{margin-top:16px}.mb14{margin-bottom:14px}.mb16{margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between}
/* Office badge colors */
.office-1{background:#1e3a5f22;color:#60a5fa;border:1px solid #1e3a5f}
.office-2{background:#3b1f6a22;color:#c084fc;border:1px solid #3b1f6a}
.office-3{background:#1a3a2a22;color:#4ade80;border:1px solid #1a3a2a}
.office-4{background:#3a1a1a22;color:#f87171;border:1px solid #3a1a1a}
.office-5{background:#3a2a1a22;color:#fb923c;border:1px solid #3a2a1a}
/* Sync indicator */
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:6px}
.sync-ok{background:#22c55e}
.sync-off{background:#ef4444}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#334155;font-family:'Courier New',monospace;font-size:1rem">Φόρτωση...</div></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4dV6vRsAazvkCyID8AbG6Ofp1cYh-t8E",
  authDomain: "fuel-track-c5824.firebaseapp.com",
  databaseURL: "https://fuel-track-c5824-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "fuel-track-c5824",
  storageBucket: "fuel-track-c5824.firebasestorage.app",
  messagingSenderId: "448236785900",
  appId: "1:448236785900:web:883b1124cd3a4b915695c9"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

// ── Accounts ──────────────────────────────────────────────────────────────────
const ACCOUNTS = {
  'admin':    { pass: 'admin123',   role: 'admin',  label: 'Κεντρικό',  color: 'office-1' },
  'grafio1':  { pass: 'grafio1pass', role: 'office', label: 'Γραφείο 1', color: 'office-1' },
  'grafio2':  { pass: 'grafio2pass', role: 'office', label: 'Γραφείο 2', color: 'office-2' },
  'grafio3':  { pass: 'grafio3pass', role: 'office', label: 'Γραφείο 3', color: 'office-3' },
  'grafio4':  { pass: 'grafio4pass', role: 'office', label: 'Γραφείο 4', color: 'office-4' },
  'grafio5':  { pass: 'grafio5pass', role: 'office', label: 'Γραφείο 5', color: 'office-5' },
};

// ── State ──────────────────────────────────────────────────────────────────────
let currentUser = JSON.parse(localStorage.getItem('ft_user') || 'null');
let rentals     = {};
let view        = 'list';
let selectedId  = null;
let newDepPhoto = null;
let retPhoto    = null;
let browseDate  = todayISO();
let synced      = false;

// ── Helpers ───────────────────────────────────────────────────────────────────
function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtDate(iso) {
  if (!iso) return '—';
  var p = iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0];
}
function addDays(iso, n) {
  var d = new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10);
}
function isToday(iso) { return iso === todayISO(); }
function fmtDayLabel(iso) {
  if (isToday(iso)) return 'ΣΗΜΕΡΑ';
  var d = new Date(iso);
  var days = ['ΚΥΡ','ΔΕΥ','ΤΡΙ','ΤΕΤ','ΠΕΜ','ΠΑΡ','ΣΑΒ'];
  return days[d.getDay()]+' '+fmtDate(iso);
}
function officeColor(username) {
  return (ACCOUNTS[username] && ACCOUNTS[username].color) || 'office-1';
}
function officeLabel(username) {
  return (ACCOUNTS[username] && ACCOUNTS[username].label) || username;
}

function compressImage(dataUrl, callback) {
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var maxW = 700, scale = img.width > maxW ? maxW/img.width : 1;
    canvas.width = img.width*scale; canvas.height = img.height*scale;
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    callback(canvas.toDataURL('image/jpeg',0.55));
  };
  img.src = dataUrl;
}

// ── Sound & Notifications ─────────────────────────────────────────────────────
var audioCtx = null;
var soundEnabled = localStorage.getItem('ft_sound') === 'true';

function initAudio() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

function playNotificationSound() {
  if (!audioCtx) return;
  // Two-tone "ding dong" sound
  function tone(freq, startTime, duration, vol) {
    var osc  = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.start(startTime); osc.stop(startTime + duration);
  }
  var t = audioCtx.currentTime;
  tone(880, t,       0.3, 0.4);
  tone(660, t + 0.35, 0.4, 0.3);
}

function showNotificationBanner(msg) {
  var old = document.getElementById('notif-banner');
  if (old) old.remove();
  var el = document.createElement('div');
  el.id = 'notif-banner';
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;font-family:Courier New,monospace;font-size:0.85rem;font-weight:700;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:slideDown 0.3s ease';
  el.innerHTML = '<span>🔔 '+msg+'</span><button onclick="this.parentNode.remove()" style="background:rgba(255,255,255,0.2);border:none;border-radius:8px;color:#fff;font-size:0.8rem;padding:4px 10px;cursor:pointer;font-family:Courier New,monospace">✕</button>';
  document.body.appendChild(el);
  // Auto-remove after 8 seconds
  setTimeout(function(){ if(el.parentNode) el.remove(); }, 8000);
}

// Add CSS animation
var styleEl = document.createElement('style');
styleEl.textContent = '@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}';
document.head.appendChild(styleEl);

// ── Firebase sync ─────────────────────────────────────────────────────────────
function startSync() {
  var dbRef = ref(db, 'rentals');
  var firstLoad = true;
  onValue(dbRef, function(snapshot) {
    var newData = snapshot.val() || {};

    // Check for new returns (only for admin, after first load)
    if (!firstLoad && currentUser && currentUser.role === 'admin' && soundEnabled) {
      Object.keys(newData).forEach(function(id) {
        var newR = newData[id];
        var oldR = rentals[id];
        // returnPhoto just appeared
        if (newR.returnPhoto && oldR && !oldR.returnPhoto) {
          var msg = officeLabel(newR.office)+' — '+newR.plate+' επέστρεψε!';
          playNotificationSound();
          showNotificationBanner(msg);
        }
      });
    }

    rentals = newData;
    synced = true;
    firstLoad = false;
    render();
  }, function() { synced = false; render(); });
}

function dbSave(rental) {
  var r = ref(db, 'rentals/'+rental.id);
  set(r, rental);
}

function dbUpdate(id, data) {
  var r = ref(db, 'rentals/'+id);
  update(r, data);
}

function dbDelete(id) {
  var r = ref(db, 'rentals/'+id);
  remove(r);
}

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  if (!currentUser) { app.innerHTML = renderLogin(); bindLogin(); return; }
  if (view==='new')    { app.innerHTML = renderNew();    bindNew(); }
  else if (view==='detail') { app.innerHTML = renderDetail(); bindDetail(); }
  else                { app.innerHTML = renderList();   bindList(); }
}

// ── LOGIN ──────────────────────────────────────────────────────────────────────
function renderLogin() {
  return '<div class="hdr"><div class="hdr-left"><span style="font-size:1.6rem">⛽</span><div><div class="logo-title">FUEL TRACK</div><div class="logo-sub">ΣΥΝΔΕΣΗ</div></div></div></div>'
    +'<div class="body" style="max-width:360px">'
    +'<div style="text-align:center;padding:30px 0 24px"><span style="font-size:3rem">⛽</span><div style="font-size:1.4rem;font-weight:900;margin-top:10px;letter-spacing:2px">FUEL TRACK</div></div>'
    +'<div class="field"><div class="lbl">Username</div><input class="inp" id="login-user" placeholder="admin" autocomplete="off" autocorrect="off" spellcheck="false" style="font-size:1.1rem;font-weight:400;letter-spacing:1px"></div>'
    +'<div class="field"><div class="lbl">Password</div><input class="inp-pass" type="password" id="login-pass" placeholder="••••••••"></div>'
    +'<div id="login-err" style="color:#f87171;font-size:0.8rem;margin-bottom:12px;display:none">Λάθος username ή password</div>'
    +'<button class="btn btn-full" id="btn-login">ΣΥΝΔΕΣΗ →</button>'
    +'</div>';
}

function bindLogin() {
  function doLogin() {
    var u = document.getElementById('login-user').value.trim().toLowerCase();
    var p = document.getElementById('login-pass').value;
    var acc = ACCOUNTS[u];
    if (acc && acc.pass === p) {
      currentUser = { username: u, role: acc.role, label: acc.label, color: acc.color };
      localStorage.setItem('ft_user', JSON.stringify(currentUser));
      startSync();
      view = 'list'; render();
    } else {
      document.getElementById('login-err').style.display = 'block';
    }
  }
  document.getElementById('btn-login').onclick = function() { initAudio(); doLogin(); };
  document.getElementById('login-pass').onkeydown = function(e){ if(e.key==='Enter') doLogin(); };
}

// ── LIST ───────────────────────────────────────────────────────────────────────
function getRentals() {
  return Object.values(rentals).filter(function(r){
    if (currentUser.role === 'admin') return true;
    return r.office === currentUser.username;
  });
}

function renderList() {
  var all    = getRentals();
  var active = all.filter(function(r){ return !r.returnPhoto; });
  var done   = all.filter(function(r){ return  r.returnPhoto; });

  // Filter active by browseDate
  var shown = active.filter(function(r){ return r.returnDate === browseDate; });
  if (isToday(browseDate)) shown = shown.concat(active.filter(function(r){ return !r.returnDate; }));

  var isAdmin = currentUser.role === 'admin';

  var html = '<div class="hdr"><div class="hdr-left"><span style="font-size:1.4rem">⛽</span><div><div class="logo-title">FUEL TRACK</div>'
    +'<div class="logo-sub" style="display:flex;align-items:center">'
    +officeLabel(currentUser.username)
    +'<span class="sync-dot '+(synced?'sync-ok':'sync-off')+'"></span>'
    +'</div></div></div>'
    +'<div style="display:flex;gap:8px">'
    +(isAdmin
      ? '<button id="btn-sound" title="Ειδοποιήσεις" style="background:'+(soundEnabled?'#0ea5e9':'#0f172a')+';border:1px solid '+(soundEnabled?'#0ea5e9':'#1e293b')+';border-radius:10px;color:'+(soundEnabled?'#fff':'#64748b')+';font-size:1rem;padding:10px 14px;cursor:pointer">🔔</button>'
      : '<button class="btn" id="btn-new">+ ΝΕΑ</button>')
    +'<button class="btn-ghost" id="btn-logout" style="padding:10px 14px;font-size:0.8rem">↩</button>'
    +'</div></div>'
    +'<div class="body">';

  // Stats
  if (isAdmin) {
    var byOffice = {};
    Object.values(rentals).forEach(function(r){
      if (!r.returnPhoto) { byOffice[r.office] = (byOffice[r.office]||0)+1; }
    });
    html += '<div class="sec">ΕΝΕΡΓΕΣ ΑΝΑ ΓΡΑΦΕΙΟ</div>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px">';
    ['grafio1','grafio2','grafio3','grafio4','grafio5'].forEach(function(k){
      html += '<div class="card" style="padding:12px;text-align:center">'
        +'<div class="badge '+officeColor(k)+'" style="margin-bottom:6px">'+officeLabel(k)+'</div>'
        +'<div style="font-size:1.6rem;font-weight:900;color:#60a5fa">'+(byOffice[k]||0)+'</div>'
        +'<div style="font-size:0.65rem;color:#475569">ΕΝΕΡΓΕΣ</div>'
        +'</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="stats">'
      +'<div class="stat"><div class="stat-num" style="color:#60a5fa">'+active.length+'</div><div class="stat-lbl">ΕΝΕΡΓΕΣ</div></div>'
      +'<div class="stat"><div class="stat-num" style="color:#4ade80">'+done.length+'</div><div class="stat-lbl">ΟΛΟΚΛ.</div></div>'
      +'<div class="stat"><div class="stat-num" style="color:#94a3b8">'+all.length+'</div><div class="stat-lbl">ΣΥΝΟΛΟ</div></div>'
      +'</div>';
  }

  // Date navigator
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">'
    +'<button id="btn-prev-day" style="background:#0f172a;border:1px solid #1e293b;border-radius:10px;color:#0ea5e9;font-size:1.2rem;padding:10px 14px;cursor:pointer">‹</button>'
    +'<div style="flex:1;text-align:center;background:#0f172a;border:1px solid '+(isToday(browseDate)?'#0ea5e9':'#1e293b')+';border-radius:10px;padding:10px">'
    +'<div style="font-size:0.85rem;font-weight:900;color:'+(isToday(browseDate)?'#0ea5e9':'#e2e8f0')+';letter-spacing:1px">'+fmtDayLabel(browseDate)+'</div>'
    +'<div style="font-size:0.65rem;color:#475569;margin-top:2px">'+shown.length+' επιστροφ'+(shown.length===1?'ή':'ές')+'</div>'
    +'</div>'
    +'<button id="btn-next-day" style="background:#0f172a;border:1px solid #1e293b;border-radius:10px;color:#0ea5e9;font-size:1.2rem;padding:10px 14px;cursor:pointer">›</button>'
    +'</div>';

  // Cards
  if (shown.length) {
    shown.forEach(function(r){ html += renderCard(r, isAdmin); });
  } else {
    html += '<div style="text-align:center;padding:28px;color:#1e293b;font-family:Courier New,monospace">'
      +'<div style="font-size:2rem;margin-bottom:8px">📭</div>'
      +'<div style="font-size:0.75rem;letter-spacing:2px;color:#334155">ΚΑΜΙΑ ΕΠΙΣΤΡΟΦΗ</div></div>';
  }

  // Done
  if (done.length) {
    html += '<div class="sec" style="margin-top:18px">✓ Ολοκληρωμένες</div>';
    done.forEach(function(r){
      html += '<div class="card card-tap" data-id="'+r.id+'" style="opacity:0.6">';
      html += '<div class="row mb14"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="plate">'+r.plate+'</span>'+(r.room?'<span class="room-badge">Δωμ.'+r.room+'</span>':'')+'</div>'
        +(isAdmin?'<span class="badge '+officeColor(r.office)+'">'+officeLabel(r.office)+'</span>':'<span class="badge badge-done">✓ ΕΠΕΣΤΡΕΨΕ</span>')+'</div>';
      if (r.brand) html += '<div style="font-size:0.7rem;color:#64748b;margin-bottom:6px">🚗 '+r.brand+'</div>';
      html += '<div class="thumbs">';
      html += r.departurePhoto?'<img class="thumb" src="'+r.departurePhoto+'" style="border:2px solid #0ea5e9">':'<div class="thumb-empty"><span>📷</span></div>';
      html += '<div class="arrow">→</div>';
      html += r.returnPhoto?'<img class="thumb" src="'+r.returnPhoto+'" style="border:2px solid #22c55e">':'<div class="thumb-empty"></div>';
      html += '</div>';
      html += '<div class="date-row"><div class="date-item"><span class="date-item-label">📅 Παραλαβή</span><span class="date-item-val">'+fmtDate(r.pickupDate)+'</span></div><div class="date-item"><span class="date-item-label">📅 Επιστροφή</span><span class="date-item-val">'+fmtDate(r.returnDate)+'</span></div></div>';
      html += '</div>';
    });
  }

  if (!all.length) {
    html += '<div class="empty"><div class="empty-icon">⛽</div><div class="empty-txt">ΚΑΜΙΑ ΕΓΓΡΑΦΗ</div><div class="empty-sub">'+(isAdmin?'Δεν υπάρχουν εγγραφές ακόμα':'Πατήστε + ΝΕΑ')+'</div></div>';
  }

  html += '</div>';
  return html;
}

function renderCard(r, isAdmin) {
  var html = '<div class="card card-tap" data-id="'+r.id+'">';
  html += '<div class="row mb14"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="plate">'+r.plate+'</span>'+(r.room?'<span class="room-badge">Δωμ.'+r.room+'</span>':'')+'</div>'
    +(isAdmin?'<span class="badge '+officeColor(r.office)+'">'+officeLabel(r.office)+'</span>':'<span class="badge badge-active">ΣΕ ΧΡΗΣΗ</span>')+'</div>';
  if (r.brand) html += '<div style="font-size:0.7rem;color:#64748b;margin-bottom:6px">🚗 '+r.brand+'</div>';
  html += '<div class="thumbs">';
  html += r.departurePhoto?'<img class="thumb" src="'+r.departurePhoto+'" style="border:2px solid #0ea5e9">':'<div class="thumb-empty"><span>📷</span><small>ΠΑΡ</small></div>';
  html += '<div class="arrow">→</div><div class="thumb-empty"><span style="color:#1e293b">?</span><small>ΕΠΙ</small></div></div>';
  html += '<div class="date-row"><div class="date-item"><span class="date-item-label">📅 Παραλαβή</span><span class="date-item-val">'+fmtDate(r.pickupDate)+'</span></div><div class="date-item"><span class="date-item-label">📅 Επιστροφή</span><span class="date-item-val">'+fmtDate(r.returnDate)+'</span></div></div>';
  html += '</div>';
  return html;
}

function bindList() {
  document.getElementById('btn-logout').onclick = function() {
    currentUser = null; localStorage.removeItem('ft_user');
    view = 'list'; render();
  };
  document.getElementById('btn-prev-day').onclick = function() { browseDate = addDays(browseDate,-1); render(); };
  document.getElementById('btn-next-day').onclick = function() { browseDate = addDays(browseDate, 1); render(); };

  var btnSound = document.getElementById('btn-sound');

function bindNew() {
  document.getElementById('btn-back').onclick = function(){ view='list'; render(); };
  var camFile = document.getElementById('inp-camera-file');
  var galFile = document.getElementById('inp-file');
  var btnCam  = document.getElementById('btn-camera');
  var btnGal  = document.getElementById('btn-gallery');
  var btnRet  = document.getElementById('btn-retake');
  if (btnCam) btnCam.onclick = function(){ camFile.click(); };
  if (btnGal) btnGal.onclick = function(){ galFile.click(); };
  if (btnRet) btnRet.onclick = function(){ galFile.click(); };

  function handleFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      compressImage(e.target.result, function(c) {
        newDepPhoto = c;
        document.getElementById('photo-area').innerHTML =
          '<div style="position:relative;border-radius:14px;overflow:hidden"><img src="'+newDepPhoto+'" style="width:100%;display:block;max-height:260px;object-fit:cover;border-radius:14px;border:3px solid #22c55e"><div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);color:#4ade80;font-size:0.75rem;font-weight:700;padding:4px 10px;border-radius:6px">✓ Παραλαβή</div><button id="btn-retake2" style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);border:1px solid #334155;border-radius:8px;color:#cbd5e1;font-size:0.85rem;font-family:Courier New,monospace;padding:6px 14px;cursor:pointer">↺ Νέα</button></div>';
        var rb = document.getElementById('btn-retake2');
        if (rb) rb.onclick = function(){ galFile.click(); };
      });
    };
    reader.readAsDataURL(file);
  }
  camFile.onchange = function(){ handleFile(this.files[0]); };
  galFile.onchange = function(){ handleFile(this.files[0]); };

  document.getElementById('btn-save').onclick = function() {
    var plate = document.getElementById('inp-plate').value.toUpperCase().trim();
    if (!plate) { alert('Συμπληρώστε πινακίδα'); return; }
    var id = 'r_'+Date.now();
    var rental = {
      id: id,
      office: currentUser.username,
      plate:  plate,
      room:   document.getElementById('inp-room').value.trim(),
      brand:  document.getElementById('inp-brand').value.trim(),
      pickupDate: document.getElementById('inp-pickup').value,
      returnDate: document.getElementById('inp-return').value,
      departurePhoto: newDepPhoto,
      returnPhoto: null,
      createdAt: Date.now()
    };
    dbSave(rental);
    newDepPhoto = null;
    view = 'list'; render();
  };
}

  return '<div class="hdr"><div class="hdr-left" style="flex-wrap:wrap;gap:8px"><span style="font-size:1.4rem">⛽</span><span class="plate">'+r.plate+'</span>'+(r.room?'<span class="room-badge">Δωμ.'+r.room+'</span>':'')+'</div><button class="btn-ghost" id="btn-back">← Πίσω</button></div>'

    +'<div class="row mb14">'

    +'<span class="badge '+officeColor(r.office)+'">'+officeLabel(r.office)+'</span>'
    +'</div>'
    +(r.brand?'<div style="font-size:0.75rem;color:#64748b;margin-bottom:10px">🚗 '+r.brand+'</div>':'')

    +'<div class="grid2"><div class="field"><div class="lbl">Πινακίδα</div><input class="inp" id="edit-plate" autocomplete="off" autocorrect="off" spellcheck="false"></div><div class="field"><div class="lbl">Δωμάτιο</div><input class="inp" id="edit-room" autocomplete="off" inputmode="numeric"></div></div>'

function bindDetail() {
  document.getElementById('btn-back').onclick = function(){ view='list'; render(); };

  var r = rentals[selectedId];
  var imgDep = document.getElementById('img-dep');
  var imgRet = document.getElementById('img-ret');
  if (imgDep) imgDep.onclick = function(){ openFullscreen(r.departurePhoto); };
  if (imgRet) imgRet.onclick = function(){ openFullscreen(r.returnPhoto); };

  var btnDel = document.getElementById('btn-del');
  if (btnDel) btnDel.onclick = function() {
    if (confirm('Διαγραφή εγγραφής;')) { dbDelete(selectedId); view='list'; render(); }
  };

  // Edit modal
  var modal  = document.getElementById('edit-modal');
  var btnEdit = document.getElementById('btn-edit');
  if (btnEdit) btnEdit.onclick = function() {
    document.getElementById('edit-plate').value  = r.plate||'';
    document.getElementById('edit-room').value   = r.room||'';
    document.getElementById('edit-brand').value  = r.brand||'';
    document.getElementById('edit-pickup').value = r.pickupDate||'';
    document.getElementById('edit-return').value = r.returnDate||'';
    modal.style.display = 'block';
  };
  var btnEditCancel = document.getElementById('edit-cancel');
  if (btnEditCancel) btnEditCancel.onclick = function(){ modal.style.display='none'; };
  var btnEditSave = document.getElementById('edit-save');
  if (btnEditSave) btnEditSave.onclick = function() {
    var plate = document.getElementById('edit-plate').value.toUpperCase().trim();
    if (!plate) { alert('Συμπληρώστε πινακίδα'); return; }
    dbUpdate(selectedId, {
      plate: plate,
      room:  document.getElementById('edit-room').value.trim(),
      brand: document.getElementById('edit-brand').value.trim(),
      pickupDate: document.getElementById('edit-pickup').value,
      returnDate: document.getElementById('edit-return').value,
    });
    modal.style.display='none'; view='detail'; render();
  };

  // Return photo
  var retCam  = document.getElementById('inp-ret-camera');
  var retFile = document.getElementById('inp-ret-file');
  if (!retFile) return;

  var btnCamRet = document.getElementById('btn-camera-ret');
  var btnGalRet = document.getElementById('btn-gallery-ret');
  var btnRtkRet = document.getElementById('btn-retake-ret');
  if (btnCamRet) btnCamRet.onclick = function(){ retCam.click(); };
  if (btnGalRet) btnGalRet.onclick = function(){ retFile.click(); };
  if (btnRtkRet) btnRtkRet.onclick = function(){ retFile.click(); };

  function handleRet(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      compressImage(e.target.result, function(c) {
        retPhoto = c;
        document.getElementById('ret-area').innerHTML =
          '<div style="position:relative;border-radius:14px;overflow:hidden"><img src="'+retPhoto+'" style="width:100%;display:block;max-height:260px;object-fit:cover;border-radius:14px;border:3px solid #22c55e"><div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);color:#4ade80;font-size:0.75rem;font-weight:700;padding:4px 10px;border-radius:6px">✓ Επιστροφή</div><button id="btn-retake-ret2" style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);border:1px solid #334155;border-radius:8px;color:#cbd5e1;font-size:0.85rem;font-family:Courier New,monospace;padding:6px 14px;cursor:pointer">↺ Νέα</button></div>';
        var rb = document.getElementById('btn-retake-ret2');
        if (rb) rb.onclick = function(){ retFile.click(); };
        var cb = document.getElementById('btn-confirm-ret');
        if (cb) cb.disabled = false;
      });
    };
    reader.readAsDataURL(file);
  }
  retCam.onchange  = function(){ handleRet(this.files[0]); };
  retFile.onchange = function(){ handleRet(this.files[0]); };

  var confirmBtn = document.getElementById('btn-confirm-ret');
  if (confirmBtn) confirmBtn.onclick = function() {
    if (!retPhoto) return;
    dbUpdate(selectedId, { returnPhoto: retPhoto });
    retPhoto = null; view='list'; render();
  };
}

// ── Fullscreen ─────────────────────────────────────────────────────────────────
function openFullscreen(src) {
  var o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center';
  var img = document.createElement('img');
  img.src = src; img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain';
  o.appendChild(img); o.onclick = function(){ o.remove(); };
  document.body.appendChild(o);
}

// ── Boot ───────────────────────────────────────────────────────────────────────
if (currentUser) { startSync(); } else { render(); }
