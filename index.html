<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fuel Track">
<meta name="application-name" content="Fuel Track">
<meta name="theme-color" content="#020617">
<meta name="description" content="Διαχείριση καυσίμων ενοικιαζόμενων αυτοκινήτων">
<title>Fuel Track</title>
<link rel="manifest" href="manifest.json">
<!-- Apple touch icon -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #020617;
    --surface: #0f172a;
    --border: #1e293b;
    --border2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --dim: #64748b;
    --blue: #0ea5e9;
    --blue-dark: #0284c7;
    --green: #22c55e;
    --green-dim: #166534;
    --plate-bg: #172554;
    --plate-border: #1d4ed8;
    --plate-text: #93c5fd;
    --red: #f87171;
    --red-dim: #7f1d1d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 12px; }
  body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; min-height: 100vh; font-size: 1rem; }

  /* Header */
  .hdr {
    background: #0a0f1e;
    border-bottom: 1px solid var(--border);
    padding: 20px 18px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .hdr-left { display: flex; align-items: center; gap: 12px; }
  .logo-title { font-size: 1.3rem; font-weight: 900; letter-spacing: 2px; }
  .logo-sub { font-size: 0.65rem; color: #334155; letter-spacing: 2px; margin-top: 2px; }

  /* Body */
  .body { padding: 18px; max-width: 560px; margin: 0 auto; }

  /* Buttons */
  .btn {
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    border: none; border-radius: 14px; color: #fff;
    font-family: 'Courier New', monospace; font-weight: 700; font-size: 1.1rem;
    padding: 18px 22px; cursor: pointer; letter-spacing: 1px;
    display: inline-block; text-align: center;
    -webkit-appearance: none;
  }
  .btn:active { opacity: 0.8; }
  .btn-full { width: 100%; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--blue);
    border-radius: 14px; color: var(--blue);
    font-family: 'Courier New', monospace; font-size: 1.1rem;
    padding: 18px 22px; cursor: pointer;
    -webkit-appearance: none;
  }
  .btn-ghost:active { opacity: 0.7; }
  .btn-danger { border-color: var(--red-dim); color: var(--red); }
  .btn:disabled { opacity: 0.35; }

  /* Storage bar */
  .storage-bar-wrap { margin-bottom: 20px; }
  .storage-bar-labels { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .storage-bar-label { font-size: 0.7rem; color: var(--dim); letter-spacing: 1px; }
  .storage-bar-track { background: var(--border); border-radius: 99px; height: 6px; overflow: hidden; }
  .storage-bar-fill { height: 100%; border-radius: 99px; transition: width 0.3s; }

  /* Card */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 14px;
  }
  .card-tap { cursor: pointer; }
  .card-tap:active { border-color: var(--blue); opacity: 0.85; }

  /* Plate */
  .plate {
    background: var(--plate-bg); border: 2px solid var(--plate-border);
    border-radius: 8px; padding: 7px 16px;
    font-size: 1.5rem; font-weight: 900; color: var(--plate-text); letter-spacing: 3px;
    display: inline-block;
  }
  .room-badge { font-size: 1.1rem; color: #60a5fa; font-weight: 700; }

  /* Status */
  .badge {
    border-radius: 20px; padding: 6px 16px;
    font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;
    display: inline-block;
  }
  .badge-active { background: #1e40af22; color: #60a5fa; border: 1px solid #1e40af; }
  .badge-done   { background: #14532d22; color: #4ade80; border: 1px solid var(--green-dim); }

  /* Inputs */
  .inp {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 16px; color: var(--text);
    font-family: 'Courier New', monospace; font-size: 1.4rem;
    letter-spacing: 2px; font-weight: 900;
    -webkit-appearance: none;
  }
  .inp:focus { outline: none; border-color: var(--blue); }

  /* Date input */
  .inp-date {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 16px; color: var(--text);
    font-family: 'Courier New', monospace; font-size: 1.1rem;
    -webkit-appearance: none; appearance: none;
  }
  .inp-date:focus { outline: none; border-color: var(--blue); }

  .lbl { font-size: 0.85rem; color: var(--dim); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
  .field { margin-bottom: 20px; }

  /* Section title */
  .sec { font-size: 0.85rem; color: var(--border2); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; border-bottom: 1px solid #0f172a; padding-bottom: 8px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; text-align: center; }
  .stat-num { font-size: 2.4rem; font-weight: 900; }
  .stat-lbl { font-size: 0.8rem; color: var(--muted); letter-spacing: 1px; margin-top: 4px; }

  /* Photo capture */
  .photo-btn {
    width: 100%; background: var(--surface); border: 2px dashed var(--border2);
    border-radius: 14px; padding: 40px 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    -webkit-appearance: none;
  }
  .photo-btn:active { border-color: var(--blue); }
  .photo-icon { font-size: 3rem; }
  .photo-lbl { color: var(--muted); font-size: 1.1rem; font-family: 'Courier New', monospace; letter-spacing: 1px; }
  .photo-sub  { color: var(--dim);   font-size: 0.9rem; font-family: 'Courier New', monospace; }

  .photo-preview { position: relative; border-radius: 14px; overflow: hidden; }
  .photo-preview img { width: 100%; display: block; max-height: 280px; object-fit: cover; border-radius: 14px; border: 2px solid var(--green); }
  .photo-overlay-tag {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.75); color: #4ade80;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 1px;
    padding: 5px 12px; border-radius: 8px; font-family: 'Courier New', monospace;
  }
  .photo-retake {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(0,0,0,0.75); border: 1px solid var(--border2);
    border-radius: 10px; color: #cbd5e1; font-size: 0.9rem;
    font-family: 'Courier New', monospace; padding: 7px 16px; cursor: pointer;
    -webkit-appearance: none;
  }

  /* Thumbnails in list */
  .thumbs { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .thumb { width: 88px; height: 88px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
  .thumb-empty {
    width: 88px; height: 88px; border-radius: 12px; flex-shrink: 0;
    background: var(--bg); border: 2px dashed var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .thumb-empty span { font-size: 1.6rem; }
  .thumb-empty small { font-size: 0.65rem; color: var(--border2); font-family: 'Courier New', monospace; }
  .arrow { flex: 1; text-align: center; font-size: 1.8rem; color: var(--border2); }

  /* Detail side-by-side */
  .photos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .photo-slot img { width: 100%; border-radius: 12px; display: block; aspect-ratio: 1; object-fit: cover; }
  .photo-slot-empty {
    aspect-ratio: 1; background: var(--surface); border-radius: 12px;
    border: 2px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--border2); font-size: 0.9rem; font-family: 'Courier New', monospace;
  }

  /* Date row in cards */
  .date-row { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
  .date-item { display: flex; flex-direction: column; gap: 3px; }
  .date-item-label { font-size: 0.75rem; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .date-item-val   { font-size: 1.1rem; color: var(--muted); font-weight: 700; }

  /* Grid */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* Empty */
  .empty { text-align: center; padding: 80px 20px; }
  .empty-icon { font-size: 4rem; margin-bottom: 16px; }
  .empty-txt  { font-size: 1rem; letter-spacing: 2px; color: var(--border2); }
  .empty-sub  { font-size: 0.85rem; margin-top: 10px; color: var(--border); }

  /* Utils */
  .mt8  { margin-top: 8px; }
  .mt14 { margin-top: 14px; }
  .mt18 { margin-top: 18px; }
  .mb14 { margin-bottom: 14px; }
  .mb18 { margin-bottom: 18px; }
  .row  { display: flex; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── State ──────────────────────────────────────────────────────────────────────
let rentals    = JSON.parse(localStorage.getItem('fueltrack_rentals') || '[]');
let view       = 'list';
let selectedId = null;
let newDepPhoto = null;
let retPhoto    = null;

function save() {
  try {
    localStorage.setItem('fueltrack_rentals', JSON.stringify(rentals));
  } catch(e) {
    alert('Δεν υπάρχει αρκετός χώρος αποθήκευσης. Διαγράψτε παλιές εγγραφές.');
  }
}

function getStorageInfo() {
  var data = localStorage.getItem('fueltrack_rentals') || '';
  var usedKB = Math.round((data.length * 2) / 1024); // UTF-16
  var maxKB  = 5120; // ~5MB
  var pct    = Math.min(100, Math.round(usedKB / maxKB * 100));
  var color  = pct < 60 ? '#22c55e' : pct < 85 ? '#eab308' : '#ef4444';
  var warn   = pct >= 85;
  return { usedKB: usedKB, maxKB: maxKB, pct: pct, color: color, warn: warn };
}

// Συμπιέζει εικόνα σε max 800px πλάτος και quality 0.6
function compressImage(dataUrl, callback) {
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var maxW = 800;
    var scale = img.width > maxW ? maxW / img.width : 1;
    canvas.width  = img.width  * scale;
    canvas.height = img.height * scale;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    callback(canvas.toDataURL('image/jpeg', 0.6));
  };
  img.src = dataUrl;
}

function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtDate(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if      (view === 'new')    { app.innerHTML = renderNew();    bindNew(); }
  else if (view === 'detail') { app.innerHTML = renderDetail(); bindDetail(); }
  else                        { app.innerHTML = renderList();   bindList(); }
}

// ── LIST ───────────────────────────────────────────────────────────────────────
function renderList() {
  const active = rentals.filter(function(r){ return !r.returnPhoto; });
  const done   = rentals.filter(function(r){ return  r.returnPhoto; });

  var html = '<div class="hdr"><div class="hdr-left"><span style="font-size:1.6rem">⛽</span><div><div class="logo-title">FUEL TRACK</div><div class="logo-sub">ΚΑΥΣΙΜΑ ΕΝΟΙΚΙΑΣΕΩΝ</div></div></div><button class="btn" id="btn-new">+ ΝΕΑ</button></div><div class="body">';
  html += '<div class="stats"><div class="stat"><div class="stat-num" style="color:#60a5fa">'+active.length+'</div><div class="stat-lbl">ΕΝΕΡΓΕΣ</div></div><div class="stat"><div class="stat-num" style="color:#4ade80">'+done.length+'</div><div class="stat-lbl">ΟΛΟΚΛΗΡΩΜΕΝΕΣ</div></div></div>';

  var si = getStorageInfo();
  html += '<div class="storage-bar-wrap">'
    + '<div class="storage-bar-labels">'
    + '<span class="storage-bar-label">💾 ΑΠΟΘΗΚΕΥΤΙΚΟΣ ΧΩΡΟΣ</span>'
    + '<span class="storage-bar-label" style="color:'+si.color+'">'+si.usedKB+'KB / '+si.maxKB+'KB ('+si.pct+'%)</span>'
    + '</div>'
    + '<div class="storage-bar-track"><div class="storage-bar-fill" style="width:'+si.pct+'%;background:'+si.color+'"></div></div>'
    + (si.warn ? '<div style="color:#ef4444;font-size:0.7rem;margin-top:5px;font-family:Courier New,monospace">⚠ Σχεδόν γεμάτο! Διαγράψτε παλιές εγγραφές.</div>' : '')
    + '</div>';

  if (active.length) {
    html += '<div class="sec">🔑 Ενεργές</div>';
    active.forEach(function(r) {
      html += '<div class="card card-tap" data-id="'+r.id+'">';
      html += '<div class="row mb14"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="plate">'+r.plate+'</span>'+(r.room?'<span class="room-badge">Δωμ. '+r.room+'</span>':'')+'</div><span class="badge badge-active">ΣΕ ΧΡΗΣΗ</span></div>';
      html += '<div class="thumbs">';
      html += r.departurePhoto ? '<img class="thumb" src="'+r.departurePhoto+'" style="border:2px solid #0ea5e9">' : '<div class="thumb-empty"><span>📷</span><small>ΠΑΡ</small></div>';
      html += '<div class="arrow">→</div><div class="thumb-empty"><span style="color:#1e293b">?</span><small>ΕΠΙ</small></div></div>';
      html += '<div class="date-row"><div class="date-item"><span class="date-item-label">📅 Παραλαβή</span><span class="date-item-val">'+fmtDate(r.pickupDate)+'</span></div><div class="date-item"><span class="date-item-label">📅 Επιστροφή</span><span class="date-item-val">'+fmtDate(r.returnDate)+'</span></div></div>';
      html += '</div>';
    });
  }

  if (done.length) {
    html += '<div class="sec" style="margin-top:22px">✓ Ολοκληρωμένες</div>';
    done.forEach(function(r) {
      html += '<div class="card card-tap" data-id="'+r.id+'" style="opacity:0.6">';
      html += '<div class="row mb14"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="plate">'+r.plate+'</span>'+(r.room?'<span class="room-badge">Δωμ. '+r.room+'</span>':'')+'</div><span class="badge badge-done">✓ ΕΠΕΣΤΡΕΨΕ</span></div>';
      html += '<div class="thumbs">';
      html += r.departurePhoto ? '<img class="thumb" src="'+r.departurePhoto+'" style="border:2px solid #0ea5e9">' : '<div class="thumb-empty"><span>📷</span></div>';
      html += '<div class="arrow">→</div>';
      html += r.returnPhoto    ? '<img class="thumb" src="'+r.returnPhoto+'"    style="border:2px solid #22c55e">' : '<div class="thumb-empty"></div>';
      html += '</div>';
      html += '<div class="date-row"><div class="date-item"><span class="date-item-label">📅 Παραλαβή</span><span class="date-item-val">'+fmtDate(r.pickupDate)+'</span></div><div class="date-item"><span class="date-item-label">📅 Επιστροφή</span><span class="date-item-val">'+fmtDate(r.returnDate)+'</span></div></div>';
      html += '</div>';
    });
  }

  if (!rentals.length) {
    html += '<div class="empty"><div class="empty-icon">⛽</div><div class="empty-txt">ΚΑΜΙΑ ΕΓΓΡΑΦΗ</div><div class="empty-sub">Πατήστε + ΝΕΑ για να ξεκινήσετε</div></div>';
  }

  html += '</div>';
  return html;
}

function bindList() {
  document.getElementById('btn-new').onclick = function() {
    newDepPhoto = null;
    view = 'new'; render();
  };
  document.querySelectorAll('.card-tap').forEach(function(el) {
    el.onclick = function() { selectedId = parseInt(el.dataset.id); retPhoto = null; view = 'detail'; render(); };
  });
}

// ── NEW ────────────────────────────────────────────────────────────────────────
function renderNew() {
  var photoArea = newDepPhoto
    ? '<div style="position:relative;border-radius:14px;overflow:hidden"><img src="'+newDepPhoto+'" style="width:100%;display:block;max-height:300px;object-fit:cover;border-radius:14px;border:3px solid #22c55e"><div style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);color:#4ade80;font-size:0.8rem;font-weight:700;padding:5px 12px;border-radius:8px;font-family:Courier New,monospace">✓ Παραλαβή</div><button id="btn-retake" style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.8);border:1px solid #334155;border-radius:10px;color:#cbd5e1;font-size:0.9rem;font-family:Courier New,monospace;padding:7px 16px;cursor:pointer">↺ Νέα</button></div>'
    : '<button id="btn-photo" style="width:100%;background:#0f172a;border:2px dashed #334155;border-radius:14px;padding:40px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px"><span style="font-size:3rem">📷</span><span style="color:#94a3b8;font-size:1.1rem;font-family:Courier New,monospace">ΤΡΑΒΗΞΤΕ ΦΩΤΟΓΡΑΦΙΑ</span><span style="color:#64748b;font-size:0.9rem;font-family:Courier New,monospace">Κάμερα ή gallery</span></button>';

  return '<div class="hdr"><div class="hdr-left"><span style="font-size:1.4rem">⛽</span><span class="logo-title">ΝΕΑ ΕΝΟΙΚΙΑΣΗ</span></div><button class="btn-ghost" id="btn-back">← Πίσω</button></div>'
    + '<div class="body">'
    + '<div class="grid2"><div class="field"><div class="lbl">Πινακίδα</div><input class="inp" id="inp-plate" placeholder="ΑΒΓ-1234" autocomplete="off" autocorrect="off" spellcheck="false"></div><div class="field"><div class="lbl">Δωμάτιο</div><input class="inp" id="inp-room" placeholder="101" autocomplete="off" inputmode="numeric"></div></div>'
    + '<div class="grid2"><div class="field"><div class="lbl">Ημ. Παραλαβής</div><input type="date" class="inp-date" id="inp-pickup" value="'+todayISO()+'"></div><div class="field"><div class="lbl">Ημ. Επιστροφής</div><input type="date" class="inp-date" id="inp-return"></div></div>'
    + '<div class="field"><div class="lbl">Φωτογραφία δείκτη καυσίμων</div><div id="photo-area">'+photoArea+'</div><input type="file" accept="image/*" capture="environment" id="inp-file" style="display:none"></div>'
    + '<button class="btn btn-full mt18" id="btn-save">✓ ΚΑΤΑΧΩΡΗΣΗ</button>'
    + '</div>';
}

function bindNew() {
  document.getElementById('btn-back').onclick = function() { view = 'list'; render(); };

  var fileInput = document.getElementById('inp-file');

  function openPicker() { fileInput.click(); }

  var btnPhoto = document.getElementById('btn-photo');
  if (btnPhoto) btnPhoto.onclick = openPicker;

  var btnRetake = document.getElementById('btn-retake');
  if (btnRetake) btnRetake.onclick = openPicker;

  fileInput.onchange = function() {
    var file = this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      compressImage(e.target.result, function(compressed) {
        newDepPhoto = compressed;
        // Show photo preview
        document.getElementById('photo-area').innerHTML =
          '<div style="position:relative;border-radius:14px;overflow:hidden">'
          + '<img src="'+newDepPhoto+'" style="width:100%;display:block;max-height:300px;object-fit:cover;border-radius:14px;border:3px solid #22c55e">'
          + '<div style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);color:#4ade80;font-size:0.8rem;font-weight:700;padding:5px 12px;border-radius:8px;font-family:Courier New,monospace">✓ Παραλαβή</div>'
          + '<button id="btn-retake2" style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.8);border:1px solid #334155;border-radius:10px;color:#cbd5e1;font-size:0.9rem;font-family:Courier New,monospace;padding:7px 16px;cursor:pointer">↺ Νέα</button>'
          + '</div>';
        var rb2 = document.getElementById('btn-retake2');
        if (rb2) rb2.onclick = openPicker;
      });
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('btn-save').onclick = function() {
    var plate = document.getElementById('inp-plate').value.toUpperCase().trim();
    if (!plate) { alert('Συμπληρώστε πινακίδα'); return; }
    var room   = document.getElementById('inp-room').value.trim();
    var pickup = document.getElementById('inp-pickup').value;
    var ret    = document.getElementById('inp-return').value;
    rentals.unshift({ id: Date.now(), plate: plate, room: room, pickupDate: pickup, returnDate: ret, departurePhoto: newDepPhoto, returnPhoto: null });
    save();
    newDepPhoto = null;
    view = 'list'; render();
  };
}

// ── DETAIL ─────────────────────────────────────────────────────────────────────
function renderDetail() {
  var r = rentals.find(function(x){ return x.id === selectedId; });
  if (!r) { view = 'list'; render(); return ''; }
  var returned = !!r.returnPhoto;

  var retAreaHTML = retPhoto
    ? '<div style="position:relative;border-radius:14px;overflow:hidden"><img src="'+retPhoto+'" style="width:100%;display:block;max-height:300px;object-fit:cover;border-radius:14px;border:3px solid #22c55e"><div style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);color:#4ade80;font-size:0.8rem;font-weight:700;padding:5px 12px;border-radius:8px;font-family:Courier New,monospace">✓ Επιστροφή</div><button id="btn-retake-ret" style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.8);border:1px solid #334155;border-radius:10px;color:#cbd5e1;font-size:0.9rem;font-family:Courier New,monospace;padding:7px 16px;cursor:pointer">↺ Νέα</button></div>'
    : '<button id="btn-photo-ret" style="width:100%;background:#0f172a;border:2px dashed #334155;border-radius:14px;padding:40px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px"><span style="font-size:3rem">📷</span><span style="color:#94a3b8;font-size:1.1rem;font-family:Courier New,monospace">ΦΩΤΟΓΡΑΦΙΑ ΕΠΙΣΤΡΟΦΗΣ</span><span style="color:#64748b;font-size:0.9rem;font-family:Courier New,monospace">Κάμερα ή gallery</span></button>';

  var depSlot = r.departurePhoto
    ? '<img id="img-dep" src="'+r.departurePhoto+'" style="width:100%;border-radius:12px;display:block;aspect-ratio:1;object-fit:cover;border:2px solid #0ea5e9;cursor:zoom-in">'
    : '<div class="photo-slot-empty">ΧΩΡΙΣ ΦΩΤΟ</div>';
  var retSlot = r.returnPhoto
    ? '<img id="img-ret" src="'+r.returnPhoto+'" style="width:100%;border-radius:12px;display:block;aspect-ratio:1;object-fit:cover;border:2px solid #22c55e;cursor:zoom-in">'
    : '<div class="photo-slot-empty">ΕΚΚΡΕΜΕΙ</div>';

  var retSection = !returned
    ? '<div class="card mb14"><div class="sec">Καταχώρηση Επιστροφής</div><div id="ret-area" class="mb18">'+retAreaHTML+'</div><input type="file" accept="image/*" capture="environment" id="inp-ret-file" style="display:none"><button class="btn btn-full" id="btn-confirm-ret"'+(retPhoto?'':' disabled')+'>✓ ΕΠΙΒΕΒΑΙΩΣΗ ΕΠΙΣΤΡΟΦΗΣ</button></div>'
    : '';

  return '<div class="hdr"><div class="hdr-left" style="flex-wrap:wrap;gap:10px"><span style="font-size:1.4rem">⛽</span><span class="plate">'+r.plate+'</span>'+(r.room?'<span class="room-badge">Δωμ. '+r.room+'</span>':'')+'</div><button class="btn-ghost" id="btn-back">← Πίσω</button></div>'
    + '<div class="body">'
    + '<div class="row mb14"><span class="badge '+(returned?'badge-done':'badge-active')+'">'+(returned?'✓ ΕΠΕΣΤΡΕΨΕ':'ΣΕ ΧΡΗΣΗ')+'</span></div>'
    + '<div class="card mb14"><div class="date-row"><div class="date-item"><span class="date-item-label">📅 Παραλαβή</span><span class="date-item-val">'+fmtDate(r.pickupDate)+'</span></div><div class="date-item"><span class="date-item-label">📅 Επιστροφή</span><span class="date-item-val">'+fmtDate(r.returnDate)+'</span></div></div></div>'
    + '<div class="photos-grid"><div class="photo-slot"><div class="lbl">Παραλαβή</div>'+depSlot+'</div><div class="photo-slot"><div class="lbl">Επιστροφή</div>'+retSlot+'</div></div>'
    + retSection
    + '<button class="btn-ghost btn-full btn-danger mt8" id="btn-del">🗑 Διαγραφή εγγραφής</button>'
    + '</div>';
}

function bindDetail() {
  document.getElementById('btn-back').onclick = function() { view = 'list'; render(); };

  var r = rentals.find(function(x){ return x.id === selectedId; });
  var imgDep = document.getElementById('img-dep');
  var imgRet = document.getElementById('img-ret');
  if (imgDep) imgDep.onclick = function() { openFullscreen(r.departurePhoto); };
  if (imgRet) imgRet.onclick = function() { openFullscreen(r.returnPhoto); };

  document.getElementById('btn-del').onclick = function() {
    if (confirm('Διαγραφή εγγραφής;')) {
      rentals = rentals.filter(function(x){ return x.id !== selectedId; });
      save(); view = 'list'; render();
    }
  };

  var retFileInput = document.getElementById('inp-ret-file');
  if (!retFileInput) return;

  function openRetPicker() { retFileInput.click(); }

  var btnPhotoRet = document.getElementById('btn-photo-ret');
  if (btnPhotoRet) btnPhotoRet.onclick = openRetPicker;

  var btnRetakeRet = document.getElementById('btn-retake-ret');
  if (btnRetakeRet) btnRetakeRet.onclick = openRetPicker;

  retFileInput.onchange = function() {
    var file = this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      compressImage(e.target.result, function(compressed) {
        retPhoto = compressed;
        document.getElementById('ret-area').innerHTML =
          '<div style="position:relative;border-radius:14px;overflow:hidden">'
          + '<img src="'+retPhoto+'" style="width:100%;display:block;max-height:300px;object-fit:cover;border-radius:14px;border:3px solid #22c55e">'
          + '<div style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);color:#4ade80;font-size:0.8rem;font-weight:700;padding:5px 12px;border-radius:8px;font-family:Courier New,monospace">✓ Επιστροφή</div>'
          + '<button id="btn-retake-ret2" style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.8);border:1px solid #334155;border-radius:10px;color:#cbd5e1;font-size:0.9rem;font-family:Courier New,monospace;padding:7px 16px;cursor:pointer">↺ Νέα</button>'
          + '</div>';
        var rb = document.getElementById('btn-retake-ret2');
        if (rb) rb.onclick = openRetPicker;
        var confirmBtn = document.getElementById('btn-confirm-ret');
        if (confirmBtn) confirmBtn.disabled = false;
      });
    };
    reader.readAsDataURL(file);
  };

  var confirmBtn = document.getElementById('btn-confirm-ret');
  if (confirmBtn) confirmBtn.onclick = function() {
    if (!retPhoto) return;
    rentals = rentals.map(function(x){ return x.id === selectedId ? Object.assign({}, x, {returnPhoto: retPhoto}) : x; });
    save(); retPhoto = null; view = 'list'; render();
  };
}

// ── Fullscreen ─────────────────────────────────────────────────────────────────
function openFullscreen(src) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center';
  var img = document.createElement('img');
  img.src = src;
  img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain';
  overlay.appendChild(img);
  overlay.onclick = function() { overlay.remove(); };
  document.body.appendChild(overlay);
}

render();
</script>
</body>
</html>
